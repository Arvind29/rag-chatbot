<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple RAG Chatbot</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#172b46;color:#fff;padding:18px 24px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#b9c7d8;font-size:13px}.app{max-width:1100px;margin:25px auto;padding:0 16px;display:grid;grid-template-columns:280px 1fr;gap:18px}.panel,.chat{background:#fff;border:1px solid #dce2ea;border-radius:10px}.panel{padding:18px;height:max-content}.panel h2{font-size:16px;margin:0 0 12px}.upload{display:block;border:1px dashed #9eabbc;padding:18px;text-align:center;border-radius:8px;color:#526174;cursor:pointer}.upload input{display:none}.files{margin-top:15px;font-size:13px}.file{padding:9px;border-bottom:1px solid #edf0f4}.chat{display:flex;flex-direction:column;height:650px}.messages{flex:1;overflow:auto;padding:22px}.msg{margin:0 0 16px;padding:13px 15px;border-radius:9px;max-width:85%;line-height:1.5;white-space:pre-wrap}.user{margin-left:auto;background:#e7f0fb}.bot{background:#f0f2f5}.composer{display:flex;border-top:1px solid #e1e5eb;padding:14px;gap:10px}.composer input{flex:1;padding:13px;border:1px solid #cbd3df;border-radius:7px;font-size:14px}.composer button{padding:0 20px;border:0;border-radius:7px;background:#2867a8;color:white;font-weight:bold}.status{font-size:12px;color:#6b7788;margin-top:10px}@media(max-width:750px){.app{grid-template-columns:1fr}.panel{order:2}.chat{height:70vh}}
</style></head>
<body>
<header><h1>Simple RAG Chatbot</h1><p>Upload a document and ask questions from its content</p></header>
<div class="app">
<aside class="panel"><h2>Knowledge Base</h2><label class="upload">Upload PDF<input id="file" type="file" accept="application/pdf"></label><div id="files" class="files">No document uploaded.</div><div id="status" class="status">Backend: not connected</div></aside>
<section class="chat"><div id="messages" class="messages"><div class="msg bot">Upload a PDF, then ask me a question about it.</div></div><form id="form" class="composer"><input id="question" placeholder="Ask a question..." autocomplete="off"><button>Send</button></form></section>
</div>
<script>
const API='http://localhost:8000';
const messages=document.getElementById('messages'),file=document.getElementById('file'),files=document.getElementById('files'),status=document.getElementById('status'),form=document.getElementById('form'),question=document.getElementById('question');
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}
async function api(path,options={}){const r=await fetch(API+path,{...options});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error('Backend returned non-JSON response ('+r.status+')')}if(!r.ok)throw new Error(d.detail||d.error||'Request failed');return d}
file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.type!=='application/pdf'){status.textContent='Please select a PDF.';return}status.textContent='Uploading and indexing...';try{const fd=new FormData();fd.append('file',f);const d=await api('/upload',{method:'POST',body:fd});files.textContent=f.name+(d.chunks?' • '+d.chunks+' chunks':'');status.textContent='Document indexed.'}catch(e){status.textContent=e.message}}
form.onsubmit=async e=>{e.preventDefault();const q=question.value.trim();if(!q)return;question.value='';add(q,'user');const wait=add('Thinking...','bot');try{const d=await api('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});wait.textContent=d.answer||d.response||'No answer returned.'}catch(e){wait.textContent='Error: '+e.message}}
</script></body></html>
